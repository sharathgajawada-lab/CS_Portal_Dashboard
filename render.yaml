services:
  - type: web
    name: cs-portal-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATA_START
        value: "2026-04-24"
      - key: CSAT_INCLUDE_BOT_CONSULTANTS
        value: "false"
      - key: DASHBOARD_ADMIN_TOKEN
        sync: false
      - key: CMS_API_KEY
        sync: false
      - key: CMS_BASE_URL
        sync: false
      - key: DOMO_CLIENT_ID
        sync: false
      - key: DOMO_CLIENT_SECRET
        sync: false
      - key: DOMO_DATASET_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
