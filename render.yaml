services:
  - type: web
    name: cs-portal-dashboard
    env: python
    pythonVersion: "3.11.9"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CMS_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false   # e.g. https://xxxxxxxxxxxx.supabase.co
      - key: SUPABASE_KEY
        sync: false   # service_role JWT from Supabase project settings
      - key: CSAT_UPLOAD_PASSWORD
        sync: false   # password for POST /upload/csat (default: hearcom2024)
      - key: DOMO_DATASET_ID
        sync: false   # CSAT data: CALL_ID, RATING, CONSULTANT_ID, etc. (default: audibene bc75b418...)
      - key: DOMO_REASONS_DATASET_ID
        sync: false   # Call details: CALL_SID__C, call reasons (default: audibene b96f9a8a...)
