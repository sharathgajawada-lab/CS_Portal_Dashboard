services:
  - type: web
    name: cs-portal-dashboard
    env: python
    pythonVersion: "3.11.9"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CMS_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false   # e.g. https://xxxxxxxxxxxx.supabase.co
      - key: SUPABASE_KEY
        sync: false   # service_role JWT from Supabase project settings
      - key: CSAT_UPLOAD_PASSWORD
        sync: false   # password for POST /upload/csat (default: hearcom2024)
      - key: DOMO_REASONS_DATASET_ID
        sync: false   # optional; set explicitly to enable reasons merge by OPPORTUNITY_ID
